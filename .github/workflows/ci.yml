name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Kotlin / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Test and package
        run: ./gradlew test installDist distZip --no-daemon --console=plain
      - name: Run installed application
        run: java -cp 'build/install/toolpermit/lib/*' io.github.almeida96.toolpermit.MainKt demo --out build/demo
      - name: Keep test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reports-${{ matrix.os }}
          path: |
            build/reports/
            build/test-results/
            build/demo/summary.json
            build/demo/audit.json
          if-no-files-found: error
      - name: Keep distribution
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: distribution
          path: build/distributions/toolpermit-0.1.0.zip
          if-no-files-found: error

  release:
    name: Publish 0.1.0
    needs: verify
    if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Release ToolPermit 0.1.0')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: distribution
          path: release
      - name: Publish tested archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd release
          sha256sum toolpermit-0.1.0.zip > SHA256SUMS
          gh release create v0.1.0 toolpermit-0.1.0.zip SHA256SUMS --target "$GITHUB_SHA" --title 'ToolPermit 0.1.0' --notes-file ../docs/releases/0.1.0.md
